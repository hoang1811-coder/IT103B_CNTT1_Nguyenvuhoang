<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let players = [];

        let numberOfPlayers = parseInt(prompt("Có bao nhiêu cầu thủ cần nhập vào đội bóng?"));

        for (let i = 0; i < numberOfPlayers; i++) {
            let playerId;
            let isDuplicate;

            do {
                isDuplicate = false;
                playerId = prompt("Nhập mã cầu thủ:");
                for (let j = 0; j < players.length; j++) {
                    let parts = players[j].split("-");
                    if (parts[0] === playerId) {
                        isDuplicate = true;
                        alert("Mã cầu thủ đã tồn tại. Nhập lại.");
                        break;
                    }
                }
            } while (isDuplicate || !playerId);

            let playerName;
            do {
                playerName = prompt("Nhập tên cầu thủ:");
            } while (!playerName || playerName.trim() === "");

            let positionChoice;
            let positionName;

            do {
                positionChoice = parseInt(prompt("Vị trí (1: Thủ môn 2: Hậu vệ 3: Tiền vệ 4: Tiền đạo):"));
            } while (positionChoice < 1 || positionChoice > 4);

            if (positionChoice === 1) positionName = "Thủ môn";
            if (positionChoice === 2) positionName = "Hậu vệ";
            if (positionChoice === 3) positionName = "Tiền vệ";
            if (positionChoice === 4) positionName = "Tiền đạo";

            players.push(playerId + "-" + playerName + "-" + positionName);
        }

        function printTeamRoster() {
            console.log("Danh sách đội bóng:");
            for (let i = 0; i < players.length; i++) {
                let parts = players[i].split("-");
                console.log(
                    (i + 1) + ". Mã: " + parts[0] +
                    " | Tên: " + parts[1] +
                    " | Vị trí: " + parts[2]
                );
            }
        }

        function pushPlayer(name, position) {
            let newId = "P" + String(players.length + 1).padStart(3, "0");
            players.push(newId + "-" + name + "-" + position);
        }

        printTeamRoster();
    </script>
</body>
</html>
