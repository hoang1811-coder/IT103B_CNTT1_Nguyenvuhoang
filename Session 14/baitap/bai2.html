<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm Chợ Tết</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .product {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            background-color: #f9f9f9;
        }

        .product h3 {
            margin: 0;
            color: #d32f2f;
        }

        .product p {
            margin: 5px 0 0;
        }

        form {
            margin-top: 20px;
        }

        input, button {
            padding: 6px;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <h1>Danh Sách Sản Phẩm Chợ Tết</h1>

    <ul id="product-list"></ul>

    <form id="product-form">
        <input type="text" id="product-name" placeholder="Tên sản phẩm" required>
        <input type="number" id="product-price" placeholder="Giá (VND)" required>
        <button type="submit">Thêm Sản Phẩm</button>
    </form>

    <script src="bai2.js"></script>
</body>
</html>
