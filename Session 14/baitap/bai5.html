<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm Chợ Tết</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .search-box {
            margin-bottom: 15px;
        }

        #search-input {
            padding: 6px;
            width: 250px;
        }

        .product-item {
            list-style: none;
            margin: 10px 0;
        }

        .product {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 6px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info h3 {
            margin: 0;
            color: #d32f2f;
        }

        .info p {
            margin: 4px 0 0;
        }

        .actions button {
            margin-left: 6px;
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        .delete-btn {
            background-color: #e53935;
        }

        .edit-price-btn {
            background-color: #1e88e5;
        }

        form {
            margin-top: 20px;
        }

        input, button {
            padding: 6px;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <h1>Danh Sách Sản Phẩm Chợ Tết</h1>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Tìm kiếm sản phẩm...">
    </div>

    <ul id="product-list"></ul>

    <form id="product-form">
        <input type="text" id="product-name" placeholder="Tên sản phẩm" required>
        <input type="number" id="product-price" placeholder="Giá (VND)" required>
        <button type="submit">Thêm Sản Phẩm</button>
    </form>

    <script src="bai5.js"></script>
</body>
</html>
